services:
  - type: web
    name: readon-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --production
    startCommand: node --experimental-sqlite server.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: "--experimental-sqlite"
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-lite:free
      - key: OPENROUTER_FALLBACK_MODEL
        value: nvidia/llama-3.1-nemotron-70b-instruct
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false

