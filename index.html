<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REadON – Know Your Skills. Build Your Future.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: ['class', '[data-theme="dark"]'],
  theme: {
    extend: {
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'monospace'],
      },
      colors: {
        brand: {
          50: '#eef2ff',
          100: '#e0e7ff',
          200: '#c7d2fe',
          400: '#818cf8',
          500: '#6366f1',
          600: '#4f46e5',
          700: '#4338ca',
          800: '#3730a3',
          900: '#312e81',
        },
        surface: {
          DEFAULT: 'var(--surface)',
          hover: 'var(--surface-hover)',
          border: 'var(--surface-border)',
        }
      }
    }
  }
}
</script>
<style>
/* =========================================
   DEGREED-INSPIRED CSS DESIGN SYSTEM
   ========================================= */
:root {
  /* Dark mode palette - navy/indigo inspired */
  --bg:              #0a0e1a;
  --bg-subtle:       #0d1120;
  --sidebar-bg:      #0f1322;
  --sidebar-border:  #1a2040;
  --surface:         #131929;
  --surface-2:       #172035;
  --surface-border:  #1e2d4a;
  --surface-hover:   #1a2640;
  --text-main:       #f0f4ff;
  --text-muted:      #8896b3;
  --text-subtle:     #4f6080;
  --accent:          #6366f1;
  --accent-light:    #818cf8;
  --accent-glow:     rgba(99,102,241,0.18);
  --accent-2:        #3b82f6;
  --success:         #10b981;
  --warning:         #f59e0b;
  --danger:          #ef4444;
  --font-family:     'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --sidebar-w:       240px;
  --header-h:        60px;
  --radius:          12px;
  --radius-sm:       8px;
  --radius-lg:       16px;
}
[data-theme="light"] {
  --bg:              #f4f6fb;
  --bg-subtle:       #eef1f8;
  --sidebar-bg:      #1e2a4a;
  --sidebar-border:  #263156;
  --surface:         #ffffff;
  --surface-2:       #f8faff;
  --surface-border:  #dde3f0;
  --surface-hover:   #f0f4ff;
  --text-main:       #111827;
  --text-muted:      #64748b;
  --text-subtle:     #9ca3af;
  --accent:          #4f46e5;
  --accent-light:    #6366f1;
  --accent-glow:     rgba(79,70,229,0.14);
  --accent-2:        #2563eb;
  --success:         #059669;
  --warning:         #d97706;
  --danger:          #dc2626;
}

/* ---- Reset & Base ---- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: var(--font-family);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* Accessibility Focus Visible Ring (WCAG 2.1 AA §2.4.7) */
:focus-visible {
  outline: 2px solid #818cf8 !important;
  outline-offset: 2px !important;
}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid #818cf8 !important;
  outline-offset: 2px !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

pre, code, textarea.code-editor-area { font-family: 'JetBrains Mono', monospace; }

/* ---- App Shell - Degreed sidebar layout ---- */
#app {
  display: flex;
  min-height: 100vh;
}

/* ---- SIDEBAR ---- */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform 0.3s ease;
  overflow-y: auto;
  overflow-x: hidden;
}
#sidebar-logo {
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--sidebar-border);
  min-height: var(--header-h);
}
#sidebar-logo .logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #6366f1, #3b82f6);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(99,102,241,0.4);
}
#sidebar-logo .logo-text {
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.5px;
  color: var(--text-main);
}
[data-theme="light"] #sidebar-logo .logo-text { color: #fff; }
#sidebar-logo .logo-text span { color: #818cf8; }
#sidebar-logo .logo-badge {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.08em;
  padding: 2px 5px;
  background: rgba(99,102,241,0.25);
  color: #818cf8;
  border: 1px solid rgba(99,102,241,0.4);
  border-radius: 5px;
  text-transform: uppercase;
}

/* Nav items */
#sidebar-nav {
  flex: 1;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-subtle);
  padding: 10px 10px 4px;
  margin-top: 4px;
}
[data-theme="light"] .nav-section-label { color: rgba(255,255,255,0.4); }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  color: var(--text-muted);
  font-size: 0.875rem;
  font-weight: 500;
  position: relative;
  user-select: none;
}
[data-theme="light"] .nav-item { color: rgba(255,255,255,0.65); }
.nav-item:hover {
  background: rgba(99,102,241,0.12);
  color: var(--text-main);
}
[data-theme="light"] .nav-item:hover { color: #fff; }
.nav-item.active {
  background: rgba(99,102,241,0.2);
  color: #818cf8;
  font-weight: 600;
}
[data-theme="light"] .nav-item.active { color: #c7d2fe; }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  background: #6366f1;
  border-radius: 0 3px 3px 0;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item .nav-badge {
  margin-left: auto;
  background: #6366f1;
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
}

/* Sidebar footer */
#sidebar-footer {
  padding: 12px 10px;
  border-top: 1px solid var(--sidebar-border);
}
#user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}
#user-card:hover { background: rgba(99,102,241,0.1); }
#user-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #3b82f6);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: white;
  flex-shrink: 0;
}
#user-info { flex: 1; min-width: 0; }
#user-info .user-name {
  font-size: 0.8125rem; font-weight: 600;
  color: var(--text-main); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
[data-theme="light"] #user-info .user-name { color: #fff; }
#user-info .user-role {
  font-size: 0.6875rem; color: var(--text-subtle);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="light"] #user-info .user-role { color: rgba(255,255,255,0.4); }

/* ---- MAIN CONTENT ---- */
#main-wrapper {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Top Header Bar */
#top-header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 90;
}
#header-search {
  flex: 1;
  max-width: 400px;
  position: relative;
}
#header-search input {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  padding: 7px 12px 7px 36px;
  font-size: 0.875rem;
  color: var(--text-main);
  outline: none;
  font-family: var(--font-family);
  transition: border-color 0.15s;
}
#header-search input:focus { border-color: var(--accent); }
#header-search input::placeholder { color: var(--text-subtle); }
#header-search svg {
  position: absolute;
  left: 10px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--text-subtle); pointer-events: none;
}
#header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.header-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: default;
}
#theme-toggle-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.15s;
}
#theme-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Main Content */
#main-content {
  flex: 1;
  padding: 28px 32px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

/* ---- DESIGN TOKENS / CARDS ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover {
  border-color: rgba(99,102,241,0.3);
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}
.card-interactive {
  cursor: pointer;
}
.card-interactive:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

/* Page header */
.page-header {
  margin-bottom: 28px;
}
.page-header h1 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0 0 4px;
}
.page-header p {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin: 0;
}

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-card .stat-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.stat-card .stat-value {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -1px;
}
.stat-card .stat-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Progress Ring (SVG) */
.progress-ring-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.progress-ring-wrap .ring-label {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}
.progress-ring-wrap .ring-pct {
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1;
}
.progress-ring-wrap .ring-sub {
  font-size: 0.6rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}

/* Badge / Pill */
.tier-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.tier-foundational  { background: rgba(107,114,128,0.2); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }
.tier-developing    { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
.tier-proficient    { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
.tier-advanced      { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.tier-master        { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }

.status-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 0.7rem; font-weight: 600;
}
.status-verified   { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.status-inprogress { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.status-notstarted { background: rgba(99,102,241,0.1); color: #818cf8; border: 1px solid rgba(99,102,241,0.2); }

/* Filter pills */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.filter-pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--surface-border);
  background: var(--surface);
  color: var(--text-muted);
  transition: all 0.15s;
}
.filter-pill:hover, .filter-pill.active {
  background: rgba(99,102,241,0.15);
  border-color: rgba(99,102,241,0.4);
  color: #818cf8;
}

/* Core/Pathway Cards */
.pathway-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.pathway-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--card-accent, #6366f1);
  opacity: 0;
  transition: opacity 0.2s;
}
.pathway-card:hover::before { opacity: 1; }
.pathway-card:hover {
  border-color: rgba(99,102,241,0.35);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  transform: translateY(-2px);
}
.pathway-card .card-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.pathway-card .card-title {
  font-weight: 700;
  font-size: 0.95rem;
  line-height: 1.3;
}
.pathway-card .card-desc {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.pathway-card .card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Skill card grid */
.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.skill-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.2s;
}
.skill-card:hover {
  border-color: rgba(99,102,241,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.skill-card .skill-name {
  font-size: 0.875rem;
  font-weight: 700;
}
.skill-card .skill-desc {
  font-size: 0.775rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.mini-bar {
  height: 4px;
  background: var(--surface-border);
  border-radius: 2px;
  overflow: hidden;
}
.mini-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}

/* Learning resource cards */
.resource-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  gap: 16px;
  transition: all 0.2s;
  cursor: pointer;
}
.resource-card:hover {
  border-color: rgba(99,102,241,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.resource-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.25rem;
}

/* Career role cards */
.role-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transition: all 0.2s;
  position: relative;
}
.role-card.active-target {
  border-color: rgba(99,102,241,0.6);
  box-shadow: 0 0 0 1px rgba(99,102,241,0.3), 0 8px 32px rgba(99,102,241,0.15);
}
.role-card:hover {
  border-color: rgba(99,102,241,0.35);
  box-shadow: 0 6px 24px rgba(0,0,0,0.2);
}
.demand-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 0.69rem;
  font-weight: 700;
}
.demand-vhigh  { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.demand-high   { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
.demand-surge  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.demand-steady { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }

/* Roadmap timeline */
.timeline {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.timeline-item {
  display: flex;
  gap: 16px;
  position: relative;
  padding-bottom: 24px;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-line {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.timeline-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  z-index: 1;
}
.timeline-connector {
  flex: 1;
  width: 2px;
  background: var(--surface-border);
  margin-top: 4px;
}
.timeline-item:last-child .timeline-connector { display: none; }
.timeline-body {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 16px 18px;
  transition: border-color 0.2s;
}
.timeline-body:hover { border-color: rgba(99,102,241,0.3); }

/* Code editor */
.code-editor-area {
  background: #060b16;
  color: #e2e8f0;
  border: 1px solid #1e293b;
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  line-height: 1.6;
  resize: vertical;
  padding: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.code-editor-area:focus { border-color: var(--accent); }

/* Achievement badge */
.achievement-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  transition: border-color 0.2s;
}
.achievement-badge:hover { border-color: rgba(245,158,11,0.4); }
.achievement-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}

/* Gradient heading */
.gradient-text {
  background: linear-gradient(135deg, #818cf8 0%, #c084fc 60%, #f472b6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Buttons */
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
  box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-primary:hover { background: #4f46e5; box-shadow: 0 6px 20px rgba(99,102,241,0.35); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  background: var(--surface);
  color: var(--text-main);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
}
.btn-secondary:hover { border-color: rgba(99,102,241,0.4); color: #818cf8; background: rgba(99,102,241,0.08); }

.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: transparent;
  color: var(--text-muted);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-weight: 500;
  font-size: 0.8125rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
}
.btn-ghost:hover { color: var(--text-main); background: var(--surface-hover); }

/* Section divider label */
.section-label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
}
.empty-state svg { margin: 0 auto 16px; opacity: 0.4; }
.empty-state h3 { font-weight: 700; font-size: 1.1rem; margin: 0 0 6px; color: var(--text-main); }
.empty-state p { font-size: 0.875rem; margin: 0; }

/* Scrollbar */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-subtle); }

/* Toast */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 999;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--surface-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  color: var(--text-main);
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  transform: translateY(80px);
  opacity: 0;
  pointer-events: none;
  max-width: 340px;
}
#toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }

/* Mobile sidebar toggle */
#sidebar-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 99;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
}
#mobile-menu-btn {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--surface-border);
  background: var(--surface-2);
  cursor: pointer;
  color: var(--text-muted);
  margin-right: 4px;
}

/* Responsive */
@media (max-width: 768px) {
  #sidebar {
    transform: translateX(-100%);
  }
  #sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 32px rgba(0,0,0,0.4);
  }
  #sidebar-overlay.open { display: block; }
  #main-wrapper { margin-left: 0; }
  #mobile-menu-btn { display: flex; }
  #main-content { padding: 20px 16px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .skill-grid { grid-template-columns: 1fr; }
}

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeInUp 0.3s ease both; }
.fade-in-delay-1 { animation-delay: 0.05s; }
.fade-in-delay-2 { animation-delay: 0.10s; }
.fade-in-delay-3 { animation-delay: 0.15s; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { animation: spin 0.8s linear infinite; }

@keyframes ringFill {
  from { stroke-dashoffset: var(--ring-full); }
  to   { stroke-dashoffset: var(--ring-offset); }
}
.ring-animate { animation: ringFill 0.9s cubic-bezier(0.4,0,0.2,1) both; animation-delay: 0.2s; }

/* Tabs */
.tab-row {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--surface-border);
  margin-bottom: 24px;
}
.tab-btn-new {
  padding: 10px 16px;
  font-size: 0.875rem;
  font-weight: 600;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  color: var(--text-muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-family: var(--font-family);
  position: relative;
  bottom: -1px;
}
.tab-btn-new:hover { color: var(--text-main); }
.tab-btn-new.active {
  color: #818cf8;
  border-bottom-color: #6366f1;
}

/* Scoring formula highlight */
.formula-block {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(99,102,241,0.1);
  border: 1px solid rgba(99,102,241,0.25);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: #818cf8;
}
</style>
</head>

        <input type="email" id="auth-email" required placeholder="user@example.com" class="w-full p-2.5 rounded-lg border text-sm" style="border-color: var(--surface-border); background: var(--bg-subtle);">
      </div>
      <div>
        <label for="auth-password" class="block text-xs font-semibold text-[var(--text-muted)] mb-1">Password</label>
        <input type="password" id="auth-password" required placeholder="Min 8 characters" class="w-full p-2.5 rounded-lg border text-sm" style="border-color: var(--surface-border); background: var(--bg-subtle);">
      </div>
      <div id="auth-error" class="text-xs text-red-400 font-semibold hidden"></div>
      <div class="flex gap-2 pt-2">
        <button type="submit" class="btn-primary flex-1 py-2 text-sm justify-center">Sign In</button>
        <button type="button" onclick="handleLogout()" class="btn-secondary py-2 px-3 text-xs text-red-400 hover:bg-red-500/10">Log Out</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast with Accessibility Live Region -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true">
  <span id="toast-icon" aria-hidden="true">✨</span>
  <span id="toast-msg">Notification message</span>
</div>

<script>
function openMobileSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}
</script>
<script src="app.js"></script>
</body>
</html>
