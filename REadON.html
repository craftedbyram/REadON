<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REadON – Know Your Skills. Build Your Future.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: ['class', '[data-theme="dark"]'],
  theme: {
    extend: {
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'monospace'],
      },
      colors: {
        brand: {
          50: '#eef2ff',
          100: '#e0e7ff',
          200: '#c7d2fe',
          400: '#818cf8',
          500: '#6366f1',
          600: '#4f46e5',
          700: '#4338ca',
          800: '#3730a3',
          900: '#312e81',
        },
        surface: {
          DEFAULT: 'var(--surface)',
          hover: 'var(--surface-hover)',
          border: 'var(--surface-border)',
        }
      }
    }
  }
}
</script>
<style>
/* =========================================
   DEGREED-INSPIRED CSS DESIGN SYSTEM
   ========================================= */
:root {
  /* Dark mode palette - navy/indigo inspired */
  --bg:              #0a0e1a;
  --bg-subtle:       #0d1120;
  --sidebar-bg:      #0f1322;
  --sidebar-border:  #1a2040;
  --surface:         #131929;
  --surface-2:       #172035;
  --surface-border:  #1e2d4a;
  --surface-hover:   #1a2640;
  --text-main:       #f0f4ff;
  --text-muted:      #8896b3;
  --text-subtle:     #4f6080;
  --accent:          #6366f1;
  --accent-light:    #818cf8;
  --accent-glow:     rgba(99,102,241,0.18);
  --accent-2:        #3b82f6;
  --success:         #10b981;
  --warning:         #f59e0b;
  --danger:          #ef4444;
  --font-family:     'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --sidebar-w:       240px;
  --header-h:        60px;
  --radius:          12px;
  --radius-sm:       8px;
  --radius-lg:       16px;
}
[data-theme="light"] {
  --bg:              #f4f6fb;
  --bg-subtle:       #eef1f8;
  --sidebar-bg:      #1e2a4a;
  --sidebar-border:  #263156;
  --surface:         #ffffff;
  --surface-2:       #f8faff;
  --surface-border:  #dde3f0;
  --surface-hover:   #f0f4ff;
  --text-main:       #111827;
  --text-muted:      #64748b;
  --text-subtle:     #9ca3af;
  --accent:          #4f46e5;
  --accent-light:    #6366f1;
  --accent-glow:     rgba(79,70,229,0.14);
  --accent-2:        #2563eb;
  --success:         #059669;
  --warning:         #d97706;
  --danger:          #dc2626;
}

/* ---- Reset & Base ---- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: var(--font-family);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* Accessibility Focus Visible Ring (WCAG 2.1 AA §2.4.7) */
:focus-visible {
  outline: 2px solid #818cf8 !important;
  outline-offset: 2px !important;
}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid #818cf8 !important;
  outline-offset: 2px !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

pre, code, textarea.code-editor-area { font-family: 'JetBrains Mono', monospace; }

/* ---- App Shell - Degreed sidebar layout ---- */
#app {
  display: flex;
  min-height: 100vh;
}

/* ---- SIDEBAR ---- */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform 0.3s ease;
  overflow-y: auto;
  overflow-x: hidden;
}
#sidebar-logo {
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--sidebar-border);
  min-height: var(--header-h);
}
#sidebar-logo .logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #6366f1, #3b82f6);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(99,102,241,0.4);
}
#sidebar-logo .logo-text {
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.5px;
  color: var(--text-main);
}
[data-theme="light"] #sidebar-logo .logo-text { color: #fff; }
#sidebar-logo .logo-text span { color: #818cf8; }
#sidebar-logo .logo-badge {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.08em;
  padding: 2px 5px;
  background: rgba(99,102,241,0.25);
  color: #818cf8;
  border: 1px solid rgba(99,102,241,0.4);
  border-radius: 5px;
  text-transform: uppercase;
}

/* Nav items */
#sidebar-nav {
  flex: 1;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-subtle);
  padding: 10px 10px 4px;
  margin-top: 4px;
}
[data-theme="light"] .nav-section-label { color: rgba(255,255,255,0.4); }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  color: var(--text-muted);
  font-size: 0.875rem;
  font-weight: 500;
  position: relative;
  user-select: none;
}
[data-theme="light"] .nav-item { color: rgba(255,255,255,0.65); }
.nav-item:hover {
  background: rgba(99,102,241,0.12);
  color: var(--text-main);
}
[data-theme="light"] .nav-item:hover { color: #fff; }
.nav-item.active {
  background: rgba(99,102,241,0.2);
  color: #818cf8;
  font-weight: 600;
}
[data-theme="light"] .nav-item.active { color: #c7d2fe; }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  background: #6366f1;
  border-radius: 0 3px 3px 0;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item .nav-badge {
  margin-left: auto;
  background: #6366f1;
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
}

/* Sidebar footer */
#sidebar-footer {
  padding: 12px 10px;
  border-top: 1px solid var(--sidebar-border);
}
#user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}
#user-card:hover { background: rgba(99,102,241,0.1); }
#user-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #3b82f6);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: white;
  flex-shrink: 0;
}
#user-info { flex: 1; min-width: 0; }
#user-info .user-name {
  font-size: 0.8125rem; font-weight: 600;
  color: var(--text-main); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
[data-theme="light"] #user-info .user-name { color: #fff; }
#user-info .user-role {
  font-size: 0.6875rem; color: var(--text-subtle);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="light"] #user-info .user-role { color: rgba(255,255,255,0.4); }

/* ---- MAIN CONTENT ---- */
#main-wrapper {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Top Header Bar */
#top-header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 90;
}
#header-search {
  flex: 1;
  max-width: 400px;
  position: relative;
}
#header-search input {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  padding: 7px 12px 7px 36px;
  font-size: 0.875rem;
  color: var(--text-main);
  outline: none;
  font-family: var(--font-family);
  transition: border-color 0.15s;
}
#header-search input:focus { border-color: var(--accent); }
#header-search input::placeholder { color: var(--text-subtle); }
#header-search svg {
  position: absolute;
  left: 10px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--text-subtle); pointer-events: none;
}
#header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.header-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: default;
}
#theme-toggle-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.15s;
}
#theme-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Main Content */
#main-content {
  flex: 1;
  padding: 28px 32px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

/* ---- DESIGN TOKENS / CARDS ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover {
  border-color: rgba(99,102,241,0.3);
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}
.card-interactive {
  cursor: pointer;
}
.card-interactive:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

/* Page header */
.page-header {
  margin-bottom: 28px;
}
.page-header h1 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0 0 4px;
}
.page-header p {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin: 0;
}

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-card .stat-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.stat-card .stat-value {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -1px;
}
.stat-card .stat-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Progress Ring (SVG) */
.progress-ring-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.progress-ring-wrap .ring-label {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}
.progress-ring-wrap .ring-pct {
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1;
}
.progress-ring-wrap .ring-sub {
  font-size: 0.6rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}

/* Badge / Pill */
.tier-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.tier-foundational  { background: rgba(107,114,128,0.2); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }
.tier-developing    { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
.tier-proficient    { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
.tier-advanced      { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.tier-master        { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }

.status-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 0.7rem; font-weight: 600;
}
.status-verified   { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.status-inprogress { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.status-notstarted { background: rgba(99,102,241,0.1); color: #818cf8; border: 1px solid rgba(99,102,241,0.2); }

/* Filter pills */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.filter-pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--surface-border);
  background: var(--surface);
  color: var(--text-muted);
  transition: all 0.15s;
}
.filter-pill:hover, .filter-pill.active {
  background: rgba(99,102,241,0.15);
  border-color: rgba(99,102,241,0.4);
  color: #818cf8;
}

/* Core/Pathway Cards */
.pathway-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.pathway-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--card-accent, #6366f1);
  opacity: 0;
  transition: opacity 0.2s;
}
.pathway-card:hover::before { opacity: 1; }
.pathway-card:hover {
  border-color: rgba(99,102,241,0.35);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  transform: translateY(-2px);
}
.pathway-card .card-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.pathway-card .card-title {
  font-weight: 700;
  font-size: 0.95rem;
  line-height: 1.3;
}
.pathway-card .card-desc {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.pathway-card .card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Skill card grid */
.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.skill-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.2s;
}
.skill-card:hover {
  border-color: rgba(99,102,241,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.skill-card .skill-name {
  font-size: 0.875rem;
  font-weight: 700;
}
.skill-card .skill-desc {
  font-size: 0.775rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.mini-bar {
  height: 4px;
  background: var(--surface-border);
  border-radius: 2px;
  overflow: hidden;
}
.mini-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}

/* Learning resource cards */
.resource-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  gap: 16px;
  transition: all 0.2s;
  cursor: pointer;
}
.resource-card:hover {
  border-color: rgba(99,102,241,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.resource-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.25rem;
}

/* Career role cards */
.role-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transition: all 0.2s;
  position: relative;
}
.role-card.active-target {
  border-color: rgba(99,102,241,0.6);
  box-shadow: 0 0 0 1px rgba(99,102,241,0.3), 0 8px 32px rgba(99,102,241,0.15);
}
.role-card:hover {
  border-color: rgba(99,102,241,0.35);
  box-shadow: 0 6px 24px rgba(0,0,0,0.2);
}
.demand-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 0.69rem;
  font-weight: 700;
}
.demand-vhigh  { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.demand-high   { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
.demand-surge  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.demand-steady { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }

/* Roadmap timeline */
.timeline {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.timeline-item {
  display: flex;
  gap: 16px;
  position: relative;
  padding-bottom: 24px;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-line {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.timeline-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  z-index: 1;
}
.timeline-connector {
  flex: 1;
  width: 2px;
  background: var(--surface-border);
  margin-top: 4px;
}
.timeline-item:last-child .timeline-connector { display: none; }
.timeline-body {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 16px 18px;
  transition: border-color 0.2s;
}
.timeline-body:hover { border-color: rgba(99,102,241,0.3); }

/* Code editor */
.code-editor-area {
  background: #060b16;
  color: #e2e8f0;
  border: 1px solid #1e293b;
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  line-height: 1.6;
  resize: vertical;
  padding: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.code-editor-area:focus { border-color: var(--accent); }

/* Achievement badge */
.achievement-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  transition: border-color 0.2s;
}
.achievement-badge:hover { border-color: rgba(245,158,11,0.4); }
.achievement-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}

/* Gradient heading */
.gradient-text {
  background: linear-gradient(135deg, #818cf8 0%, #c084fc 60%, #f472b6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Buttons */
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
  box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-primary:hover { background: #4f46e5; box-shadow: 0 6px 20px rgba(99,102,241,0.35); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  background: var(--surface);
  color: var(--text-main);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
}
.btn-secondary:hover { border-color: rgba(99,102,241,0.4); color: #818cf8; background: rgba(99,102,241,0.08); }

.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: transparent;
  color: var(--text-muted);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-weight: 500;
  font-size: 0.8125rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
}
.btn-ghost:hover { color: var(--text-main); background: var(--surface-hover); }

/* Section divider label */
.section-label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
}
.empty-state svg { margin: 0 auto 16px; opacity: 0.4; }
.empty-state h3 { font-weight: 700; font-size: 1.1rem; margin: 0 0 6px; color: var(--text-main); }
.empty-state p { font-size: 0.875rem; margin: 0; }

/* Scrollbar */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-subtle); }

/* Toast */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 999;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--surface-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  color: var(--text-main);
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  transform: translateY(80px);
  opacity: 0;
  pointer-events: none;
  max-width: 340px;
}
#toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }

/* Mobile sidebar toggle */
#sidebar-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 99;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
}
#mobile-menu-btn {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--surface-border);
  background: var(--surface-2);
  cursor: pointer;
  color: var(--text-muted);
  margin-right: 4px;
}

/* Responsive */
@media (max-width: 768px) {
  #sidebar {
    transform: translateX(-100%);
  }
  #sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 32px rgba(0,0,0,0.4);
  }
  #sidebar-overlay.open { display: block; }
  #main-wrapper { margin-left: 0; }
  #mobile-menu-btn { display: flex; }
  #main-content { padding: 20px 16px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .skill-grid { grid-template-columns: 1fr; }
}

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeInUp 0.3s ease both; }
.fade-in-delay-1 { animation-delay: 0.05s; }
.fade-in-delay-2 { animation-delay: 0.10s; }
.fade-in-delay-3 { animation-delay: 0.15s; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { animation: spin 0.8s linear infinite; }

@keyframes ringFill {
  from { stroke-dashoffset: var(--ring-full); }
  to   { stroke-dashoffset: var(--ring-offset); }
}
.ring-animate { animation: ringFill 0.9s cubic-bezier(0.4,0,0.2,1) both; animation-delay: 0.2s; }

/* Tabs */
.tab-row {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--surface-border);
  margin-bottom: 24px;
}
.tab-btn-new {
  padding: 10px 16px;
  font-size: 0.875rem;
  font-weight: 600;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  color: var(--text-muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-family: var(--font-family);
  position: relative;
  bottom: -1px;
}
.tab-btn-new:hover { color: var(--text-main); }
.tab-btn-new.active {
  color: #818cf8;
  border-bottom-color: #6366f1;
}

/* Scoring formula highlight */
.formula-block {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(99,102,241,0.1);
  border: 1px solid rgba(99,102,241,0.25);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: #818cf8;
}
</style>

  if (!values || values.length === 0) return { cleanedValues: [], outliersCount: 0, mean: 0 };
  
  const sum = values.reduce((a, b) => a + b, 0);
  const mean = sum / values.length;

      cleaned.push(v);
    } else {

/**
 * Calculates Skill Proficiency: P = 0.30K + 0.50A + 0.20R
 * PRD Section 12.1
 */
function calculateSkillProficiency(kScore, aScore, rScore) {
  const k = Math.min(100, Math.max(0, kScore || 0));
  const a = Math.min(100, Math.max(0, aScore || 0));
  const r = Math.min(100, Math.max(0, rScore || 0));
  const p = Math.round((0.30 * k) + (0.50 * a) + (0.20 * r));
  return { k, a, r, p };
}

/**
 * Calculates Confidence Rating
 * PRD Section 12.2 (reflects amount, variety, consistency of evidence)
 */
function calculateConfidence(attempts, hasPractical, scoreP) {
  if (!attempts || attempts <= 0) return "Not Assessed";
  if (attempts === 1) return "Low (Preliminary)";
  if (attempts === 2) return "Medium";
  if (attempts >= 3 && hasPractical && scoreP >= 80) return "Verified Mastery";
  return "High";
}

/**
 * Calculates Role Alignment & Identifies Mandatory Skill Gaps
 * PRD Section 12.3 & 12.4
 */
function calculateRoleAlignment(roleId) {
  const role = CAREER_ROLES.find(r => r.id === roleId) || CAREER_ROLES[0];
  let weightedScoreSum = 0;
  let totalWeight = 0;
  const skillBreakdown = [];
  const mandatoryGaps = [];

  for (const req of role.skills) {
    const userProf = appState.skillProficiencies[req.skillId];
    const score = userProf ? userProf.p : 0;
    const confidence = userProf ? userProf.confidence : "None";
    
    weightedScoreSum += score * req.weight;
    totalWeight += req.weight;

    const isDeficit = score < req.minProficiency;
    if (req.mandatory && isDeficit) {
      mandatoryGaps.push({
        skillId: req.skillId,
        name: req.name,
        current: score,
        required: req.minProficiency,
        deficit: req.minProficiency - score
      });
    }

    skillBreakdown.push({
      ...req,
      currentScore: score,
      confidence,
      isDeficit,
      deficit: Math.max(0, req.minProficiency - score)
    });
  }

  const alignmentPercentage = totalWeight > 0 ? Math.round(weightedScoreSum / totalWeight) : 0;

  return {
    role,
    alignmentPercentage,
    skillBreakdown,
    mandatoryGaps,
    hasCriticalDeficit: mandatoryGaps.length > 0
  };
}

async function callOpenRouterAI(prompt, systemInstruction = "You are the REadON AI Skill Evaluator. Provide structured, constructive feedback.") {
  const { apiKey, model, fallbackModel, enableAI } = appState.aiSettings;
  if (!enableAI || !apiKey) {
    return null;
  }

  async function requestModel(targetModel) {
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey.trim()}`,
        "Content-Type": "application/json",
        "HTTP-Referer": "https://readon.skillquest.local",
        "X-Title": "REadON Skill Platform"
      },
      body: JSON.stringify({
        model: targetModel,
        messages: [
          { role: "system", content: systemInstruction },
          { role: "user", content: prompt }
        ],
        temperature: 0.3,
        max_tokens: 600
      })
    });

    if (!response.ok) return null;
    const data = await response.json();
    return data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : null;
  }

  try {
    // 1. Try Primary Model (e.g. Gemini 2.0 Flash)
    const primaryResult = await requestModel(model || "google/gemini-2.0-flash-lite:free");
    if (primaryResult) return primaryResult;

    // 2. Failover to NVIDIA Nemotron if primary fails
    const nemotronModel = fallbackModel || "nvidia/llama-3.1-nemotron-70b-instruct";
    console.log(`[OpenRouter Failover] Primary model unavailable. Calling NVIDIA Nemotron (${nemotronModel})...`);
    const fallbackResult = await requestModel(nemotronModel);
    if (fallbackResult) {
      console.log(`[OpenRouter Failover] NVIDIA Nemotron evaluation succeeded!`);
      return fallbackResult;
    }

    return null;
  } catch (err) {
    console.warn("OpenRouter call failed gracefully (using deterministic fallback):", err);
    return null;
  }
}

function navigate(screenName, context = null) {
  currentScreen = screenName;
  activeAssessmentContext = context;

  // Update sidebar nav active state
  document.querySelectorAll(".nav-item").forEach(item => {
    if (item.getAttribute("data-target") === screenName) {
      item.classList.add("active");
    } else {
      item.classList.remove("active");
    }
  });

  // Also update legacy tab-btn if any exist
  document.querySelectorAll(".tab-btn").forEach(btn => {
    if (btn.getAttribute("data-target") === screenName) {
      btn.classList.add("active");
    } else {
      btn.classList.remove("active");
    }
  });

  // Close mobile sidebar on navigate
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebar-overlay')?.classList.remove('open');

  const container = document.getElementById("screen-container");
  container.innerHTML = "";

  switch (screenName) {
    case "dashboard":
      renderDashboard(container);
      break;
    case "cores":
      renderExploreCores(container);
      break;
    case "roles":
      renderCareerRoles(container);
      break;
    case "assessment":
      renderAssessmentCenter(container, context);
      break;
    case "results":
      renderAssessmentResults(container, context);
      break;
    case "skills":
      renderMySkills(container);
      break;
    case "learning":
      renderLearningHub(container);
      break;
    case "roadmap":
      renderCareerRoadmap(container);
      break;
    case "aichat":
      renderAIChat(container);
      break;
    case "history":
      renderHistory(container);
      break;
    case "settings":
      renderSettings(container);
      break;
    default:
      renderDashboard(container);
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Toast helper
function showToast(message, icon = "✨") {
  const toast = document.getElementById("toast");
  const msg = document.getElementById("toast-msg");
  const ico = document.getElementById("toast-icon");
  if (!toast) return;

  msg.textContent = message;
  ico.textContent = icon;
  toast.classList.add("show");
  toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
  clearTimeout(window._toastTimeout);
  window._toastTimeout = setTimeout(() => {
    toast.classList.remove("show");
    toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
  }, 3500);
}

  if (theme === "dark") {
    sun?.classList.remove("hidden");
    moon?.classList.add("hidden");
  } else {
    sun?.classList.add("hidden");
    moon?.classList.remove("hidden");
  }
}

  function ringHtml(pct, size, stroke, color, sub) {
    const r = (size - stroke) / 2;
    const circ = +(2 * Math.PI * r).toFixed(2);

    return `<div class="progress-ring-wrap" style="width:${size}px;height:${size}px;">

async function submitCoreTask(coreId) {
  const task = CORE_PRACTICAL_TASKS[coreId];
  if (!task) return;

  const code = document.getElementById("core-code-input").value;
  const statusEl = document.getElementById("core-exec-status");
  const testBox = document.getElementById("core-test-results-box");
  const submitBtn = document.getElementById("btn-submit-core");

  statusEl.innerHTML = `<span class="text-blue-400 font-semibold animate-pulse">Running unit assertions in sandbox...</span>`;
  submitBtn.disabled = true;

  let passedCount = 0;
  const results = [];

  try {
    // Dynamically detect declared function name from code
    const matchFn = code.match(/function\s+([a-zA-Z0-9_$]+)/);
    const fnName = matchFn ? matchFn[1] : null;

    const userFn = new Function('input', `
      ${code}
      if ("${fnName}" && typeof ${fnName} === 'function') {
        return Array.isArray(input) ? ${fnName}(...input) : ${fnName}(input);
      }
      if (typeof sanitizeUserPayload === 'function') return sanitizeUserPayload(input);
      if (typeof paginateItems === 'function') return paginateItems(...input);
      if (typeof handleCreateTask === 'function') return handleCreateTask(input);
      if (typeof aggregateCustomerSpend === 'function') return aggregateCustomerSpend(...input);
      if (typeof cleanDataOutliers === 'function') return cleanDataOutliers(input);
      if (typeof validateServiceDependencies === 'function') return validateServiceDependencies(input);
      if (typeof auditSecurityHeaders === 'function') return auditSecurityHeaders(...input);
      return null;
    `);

    for (const test of task.tests) {
      let isPass = false;
      let errMsg = "";
      try {
        const output = userFn(test.input);
        isPass = test.expectedCheck ? test.expectedCheck(output) : (output !== null && output !== undefined);
      } catch (e) {
        errMsg = e.message;
      }
      if (isPass) passedCount++;
      results.push({ name: test.name, isPass, errMsg });
    }
  } catch (compileErr) {
    statusEl.innerHTML = `<span class="text-red-400 font-bold">Compilation Error: ${compileErr.message}</span>`;
    submitBtn.disabled = false;
    return;
  }

  // Update Test status box
  testBox.innerHTML = results.map(r => `
    <div class="p-2.5 rounded-lg border flex items-center justify-between text-xs" style="border-color: ${r.isPass ? '#10b981' : '#ef4444'}; background: ${r.isPass ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'}">
      <span class="text-gray-200 font-medium">${r.name}</span>
      <span class="badge-pill ${r.isPass ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'} text-[10px]">
        ${r.isPass ? 'Passed ✓' : 'Failed ✗'}
      </span>
    </div>
  `).join("");

  const aScore = Math.round((passedCount / task.tests.length) * 100);
  const kScore = aScore > 0 ? 85 : 45;
  const rScore = passedCount === task.tests.length ? 90 : 65;
  const { p } = calculateSkillProficiency(kScore, aScore, rScore);

  statusEl.innerHTML = `<span class="text-purple-400 font-semibold animate-pulse">OpenRouter AI diagnosing career role & core learning roadmap...</span>`;

  // AI Prompt to identify role and core learning path
  const prompt = `As the REadON Career Advisor, evaluate this student's practical test performance:
Core: ${task.coreName}
Task: ${task.title}
Automated Tests Passed: ${passedCount}/${task.tests.length} (Demonstrated Score: ${p}%)

Code:
\`\`\`javascript
${code}
\`\`\`

Diagnose:
1) Which Career Role (Frontend Developer, Backend Developer, Full-Stack Developer, Data Analyst, Python Developer, AI App Developer) best fits their demonstrated abilities?
2) Why this role fits?
3) What 2 specific skill gaps in ${task.coreName} must they study next?
4) Give a tailored 2-item learning roadmap for this core.
Keep it structured, concise, and inspiring.`;

  let aiDiagnosis = await callOpenRouterAI(prompt);

  if (!aiDiagnosis) {
    // Deterministic fallback
    aiDiagnosis = `🎯 Recommended Career Role: ${task.alignedRole} (${Math.max(65, p)}% Alignment Match)
    
• Demonstrated Practical Strengths:
Your code exhibits strong functional organization and cleanly passes ${passedCount}/${task.tests.length} automated unit tests. Your approach shows natural alignment with ${task.alignedRole} patterns.

• Diagnosed Core Skill Gaps (${task.coreName}):
1. Defensive boundary verification for missing or nullish attributes.
2. Robust error response payloads following standardized conventions.

• Recommended Core Learning Roadmap:
1. ${task.learningModules[0]} (High Priority - Core competency)
2. ${task.learningModules[1]} (Medium Priority - Production readiness)`;
  }

  // Update App State
  const primarySkill = `${coreId}_vars`;
  const prevAttempts = (appState.skillProficiencies[primarySkill]?.attempts || 0) + 1;
  const conf = calculateConfidence(prevAttempts, true, p);

  appState.skillProficiencies[primarySkill] = {
    k: kScore,
    a: aScore,
    r: rScore,
    p: p,
    confidence: conf,
    attempts: prevAttempts,
    lastAssessed: new Date().toISOString().split("T")[0]
  };

  // Add to History
  appState.history.unshift({
    id: `att_core_${Date.now()}`,
    date: new Date().toLocaleDateString("en-US", { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
    skillId: primarySkill,
    skillName: `${task.coreName} Practical`,
    type: "Practical Core Task",
    k: kScore,
    a: aScore,
    r: rScore,
    p: p,
    passed: passedCount === task.tests.length,
    feedback: aiDiagnosis
  });

  appState.gamification.xp += 250;
  saveState();
  showToast("Practical Task Evaluated! +250 XP earned", "🎯");

  // Render Role Identification & Core Learning Report
  renderRoleDiagnosticReport(container, {
    task,
    passedCount,
    totalTests: task.tests.length,
    pScore: p,
    kScore,
    aScore,
    rScore,
    aiDiagnosis,
    alignedRole: task.alignedRole,
    learningModules: task.learningModules
  });
}

let currentQuizIndex = 0;
let userQuizAnswers = {};

function startKnowledgeQuiz() {
  currentQuizIndex = 0;
  userQuizAnswers = {};
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const container = document.getElementById("screen-container");
  const q = KNOWLEDGE_QUESTIONS[currentQuizIndex];
  const total = KNOWLEDGE_QUESTIONS.length;
  const selected = userQuizAnswers[currentQuizIndex];

  container.innerHTML = `
    <div class="max-w-2xl mx-auto space-y-6">
      <div class="flex items-center justify-between text-xs text-gray-400">
        <button onclick="navigate('assessment')" class="hover:text-white flex items-center gap-1 font-semibold">

        </button>
        <span>Question ${currentQuizIndex + 1} of ${total}</span>
      </div>

      <div class="w-full bg-gray-700/50 h-2 rounded-full overflow-hidden">
        <div class="bg-purple-500 h-full rounded-full transition-all" style="width: ${((currentQuizIndex + 1)/total)*100}%"></div>

        <div class="space-y-3">
          ${q.options.map((opt, i) => `
            <button onclick="selectQuizAnswer(${i})" class="w-full text-left p-4 rounded-xl border text-sm transition flex items-start gap-3 ${selected === i ? 'border-purple-500 bg-purple-500/10 ring-1 ring-purple-500' : 'hover:border-gray-600'}" style="border-color: ${selected === i ? '#a855f7' : 'var(--surface-border)'}; background: ${selected === i ? 'rgba(168,85,247,0.1)' : 'var(--surface)'}">
              <div class="w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold shrink-0 ${selected === i ? 'bg-purple-500 text-white border-purple-500' : 'border-gray-500 text-gray-400'}">
                ${String.fromCharCode(65 + i)}
              </div>
              <div class="flex-1">${opt.text}</div>
            </button>
          `).join("")}
        </div>

        <div class="flex items-center justify-between mt-8 pt-4 border-t" style="border-color: var(--surface-border)">
          <button onclick="prevQuizQuestion()" ${currentQuizIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed"' : 'class="font-semibold text-xs text-gray-300 hover:text-white"'}>

          </button>
          ${currentQuizIndex === total - 1 ? `

            </button>
          ` : `

            </button>
          `}
        </div>
      </div>
    </div>
  `;
}

function selectQuizAnswer(index) {
  userQuizAnswers[currentQuizIndex] = index;
  renderQuizQuestion();
}

function nextQuizQuestion() {
  if (currentQuizIndex < KNOWLEDGE_QUESTIONS.length - 1) {
    currentQuizIndex++;
    renderQuizQuestion();
  }
}

function prevQuizQuestion() {
  if (currentQuizIndex > 0) {
    currentQuizIndex--;
    renderQuizQuestion();
  }
}

function submitKnowledgeQuiz() {
  let correctCount = 0;
  const questionsTotal = KNOWLEDGE_QUESTIONS.length;
  const detailedResults = [];

  KNOWLEDGE_QUESTIONS.forEach((q, idx) => {
    const userChoice = userQuizAnswers[idx];
    const isCorrect = userChoice !== undefined && q.options[userChoice].isCorrect;
    if (isCorrect) correctCount++;
    detailedResults.push({
      q,
      userChoice,
      isCorrect,
      explanation: userChoice !== undefined ? q.options[userChoice].explanation : "Unanswered"
    });
  });

  const kScore = Math.round((correctCount / questionsTotal) * 100);
  const aScore = 70; // Baseline applied

function resetTaskCode(taskId) {

async function runSandboxCode(taskId) {
  const task = PRACTICAL_TASKS.find(t => t.id === taskId);
  if (!task) return;

  const code = document.getElementById("code-input").value;
  const statusEl = document.getElementById("exec-status");
  const testBox = document.getElementById("test-results-box");
  statusEl.textContent = "Executing automated assertions...";

  let passedCount = 0;
  const results = [];

  try {
    // Create safe sandbox function evaluation
    const userFn = new Function(`${code}; return sanitizeUserPayload;`)();

    for (const test of task.tests) {
      let isPass = false;
      let errMsg = "";
      try {
        const output = userFn(test.input);
        isPass = test.expectedCheck(output);
      } catch (e) {
        errMsg = e.message;
      }

      if (isPass) passedCount++;
      results.push({ name: test.name, isPass, errMsg });
    }
  } catch (err) {
    statusEl.innerHTML = `<span class="text-red-400">Compilation Error: ${err.message}</span>`;
    return;
  }

  // Render Test Results
  testBox.innerHTML = results.map(r => `
    <div class="p-2.5 rounded-lg border flex items-center justify-between text-xs" style="border-color: ${r.isPass ? '#10b981' : '#ef4444'}; background: ${r.isPass ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'}">
      <span class="text-gray-200 font-medium">${r.name}</span>
      <span class="badge-pill ${r.isPass ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'} text-[10px]">
        ${r.isPass ? 'Passed ✓' : 'Failed ✗'}
      </span>
    </div>
  `).join("");

  const aScore = Math.round((passedCount / task.tests.length) * 100);
  statusEl.innerHTML = `<span class="${passedCount === task.tests.length ? 'text-emerald-400' : 'text-amber-400'} font-bold">${passedCount}/${task.tests.length} Tests Passed (Score: ${aScore}%)</span>`;

  // Request OpenRouter AI Evaluation for Reasoning Score (R) & Rubric feedback
  let aiFeedback = null;
  const prompt = `Evaluate this student's JavaScript solution for a practical coding challenge:\n\nTask: ${task.scenario}\nCode:\n\`\`\`javascript\n${code}\n\`\`\`\nAutomated tests passed: ${passedCount}/${task.tests.length}.\n\nProvide 3 short bullet points: 1) Strengths, 2) Gaps or edge cases, 3) Next learning advice. Keep it concise.`;

  statusEl.textContent = "Requesting OpenRouter AI qualitative rubric evaluation...";
  aiFeedback = await callOpenRouterAI(prompt);

  if (!aiFeedback) {
    // Deterministic fallback (PRD §15.3 & §15.4)
    aiFeedback = passedCount === task.tests.length
      ? "• Strengths: All input boundaries, trimming, and type normalization pass correctly.\n• Gaps: Consider validating strict RFC-compliant email formats with regex in production.\n• Next Step: Explore asynchronous payload processing and schema validation with Zod."
      : "• Strengths: Function structure is cleanly organized.\n• Gaps: Some edge cases (underage or missing email) failed assertions.\n• Next Step: Check nullish coalescing operators and ensure error arrays collect all failures.";
  }

  const aiBox = document.getElementById("ai-feedback-container");
  const aiText = document.getElementById("ai-feedback-text");
  if (aiBox && aiText) {
    aiBox.classList.remove("hidden");
    aiText.textContent = aiFeedback;
  }

  // Calculate overall proficiency using PRD Formula: P = 0.30K + 0.50A + 0.20R
  const kScore = 80; // Baseline knowledge
  const rScore = passedCount === task.tests.length ? 90 : 60;
  const { p } = calculateSkillProficiency(kScore, aScore, rScore);

  // Update State
  const targetSkill = task.skillId;
  const prevAttempts = (appState.skillProficiencies[targetSkill]?.attempts || 0) + 1;
  const conf = calculateConfidence(prevAttempts, true, p);

  appState.skillProficiencies[targetSkill] = {
    k: kScore,
    a: aScore,
    r: rScore,
    p: p,
    confidence: conf,
    attempts: prevAttempts,
    lastAssessed: new Date().toISOString().split("T")[0]
  };

  // Add History attempt
  appState.history.unshift({
    id: `att_${Date.now()}`,
    date: new Date().toLocaleDateString("en-US", { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
    skillId: targetSkill,
    skillName: getSkillById(targetSkill)?.name || "Programming Task",
    type: "Practical Code Sandbox",
    k: kScore,
    a: aScore,
    r: rScore,
    p: p,
    passed: passedCount === task.tests.length,
    feedback: aiFeedback
  });

  appState.gamification.xp += 200;
  saveState();
  showToast(`Practical assessment submitted! Earned +200 XP`, "⚡");
}

function submitGameSolution(gameId) {
  if (gameTimerInterval) clearInterval(gameTimerInterval);
  const game = GAMIFIED_CHALLENGES.find(g => g.id === gameId);
  const code = document.getElementById("game-code-input").value;
  const statusEl = document.getElementById("game-status");

  let isSuccess = false;

  try {
    if (gameId === "game_bug_hunter") {
      const fn = new Function(`${code}; return calculateCartTax;`)();
      const res = fn([{ price: 10, qty: 1 }, { price: 20, qty: 2 }, { price: 15, qty: 1 }], 0.10);
      isSuccess = res.subtotal === 65 && res.tax === 6.5;
    } else if (gameId === "game_sql_detective") {
      const fn = new Function(`${code}; return detectDuplicateAccounts;`)();
      const res = fn([
        { id: 1, phone: "555-0199", email: "a@x.com" },
        { id: 2, phone: "555-0123", email: "b@x.com" },
        { id: 3, phone: "555-0199", email: "c@x.com" }
      ]);
      isSuccess = Array.isArray(res) && res.length === 1 && res[0] === "555-0199";
    } else {
      isSuccess = code.includes("await") && (code.includes("201") || code.includes("status: 201"));
    }
  } catch (e) {
    statusEl.innerHTML = `<span class="text-red-400">Execution Error: ${e.message}</span>`;
    return;
  }

  if (isSuccess) {
    appState.gamification.xp += 250;
    saveState();
    showToast("Challenge Solved! +250 XP earned", "🎉");
    navigate("results", {
      title: `${game.title} Completed!`,

      kScore: 90,
      aScore: 95,
      rScore: 90,
      pScore: 92,
      passed: true,
      feedback: "Defect diagnosed and repaired successfully. Loop invariants and boundary logic demonstrated."
    });
  } else {
    statusEl.innerHTML = `<span class="text-amber-400">Test failed: The bug is still present. Review the hint and loop condition!</span>`;
  }
}

function renderChatMessageBubble(msg) {
  const isUser = msg.role === "user";
  const formattedContent = escapeHtml(msg.content)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.3);padding:2px 5px;border-radius:4px;color:#818cf8;font-size:0.8rem;">$1</code>')
    .replace(/\n/g, '<br>');

  return `
    <div style="display:flex;gap:12px;align-items:flex-start;${isUser ? 'flex-direction:row-reverse;' : ''}">
      <div style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;${isUser ? 'background:linear-gradient(135deg,#6366f1,#3b82f6);color:white;' : 'background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;'}">
        ${isUser ? 'AU' : '🤖'}
      </div>
      <div style="max-width:82%;display:flex;flex-direction:column;align-items:${isUser ? 'flex-end' : 'flex-start'};gap:4px;">
        <div style="display:flex;align-items:center;gap:6px;font-size:0.7rem;color:var(--text-muted);">
          <span>${isUser ? appState.user.name : 'REadON AI Mentor'}</span>

        </div>
        <div style="padding:12px 16px;border-radius:12px;font-size:0.85rem;line-height:1.6;${isUser ? 'background:var(--accent);color:white;border-top-right-radius:2px;' : 'background:var(--surface-2);border:1px solid var(--surface-border);color:var(--text-main);border-top-left-radius:2px;'}">
          ${formattedContent}
        </div>
      </div>
    </div>
  `;
}

function handleChatKeyDown(event) {

    event.preventDefault();
    handleAIChatSubmit(event);
  }

function clearAIChatHistory() {

async function handleAIChatSubmit(event) {
  if (event) event.preventDefault();
  const input = document.getElementById("ai-chat-input");
  const sendBtn = document.getElementById("btn-send-chat");
  const chatBox = document.getElementById("ai-chat-box");
  if (!input) return;

  const userText = input.value.trim();
  if (!userText) return;

  // Append user message
  const userMsg = { role: "user", content: userText };
  appState.aiChatHistory.push(userMsg);
  input.value = "";
  saveState();

  // Re-render chat box
  chatBox.innerHTML = appState.aiChatHistory.map(msg => renderChatMessageBubble(msg)).join("") + `
    <div id="ai-typing-indicator" style="display:flex;gap:12px;align-items:center;">
      <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">🤖</div>
      <div style="font-size:0.775rem;color:#818cf8;display:flex;align-items:center;gap:6px;" class="animate-pulse">
        <span>AI Mentor is reasoning (Gemini 2.0 / NVIDIA Nemotron)...</span>
      </div>
    </div>
  `;
  chatBox.scrollTop = chatBox.scrollHeight;
  if (sendBtn) sendBtn.disabled = true;

  // Format messages for AI
  const historyForAPI = appState.aiChatHistory.slice(-8).map(m => ({
    role: m.role,
    content: m.content
  }));

  let aiReplyText = "";
  let modelBadge = "Gemini 2.0 Flash Lite";

  // 1. Attempt Backend API call
  try {
    const response = await fetch('/api/v1/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: historyForAPI,
        context: {
          currentRole: CAREER_ROLES.find(r => r.id === appState.user.targetRoleId)?.name,
          xp: appState.gamification.xp,
          streak: appState.gamification.streak
        }
      })
    });

    if (response.ok) {
      const data = await response.json();
      if (data && data.message) {
        aiReplyText = data.message;
        modelBadge = data.modelUsed ? data.modelUsed.split('/').pop() : "Gemini 2.0 / Nemotron";
      }
    }
  } catch (backendErr) {
    console.log("Backend AI chat route unreachable, falling back to direct OpenRouter:", backendErr.message);
  }

  // 2. Client fallback via direct OpenRouter if backend was unavailable
  if (!aiReplyText) {
    try {
      const directAI = await callOpenRouterAI(userText);
      if (directAI) {
        aiReplyText = directAI;
        modelBadge = "OpenRouter Direct";
      }
    } catch (e) {}
  }

  // 3. Deterministic mentor fallback if both failed
  if (!aiReplyText) {
    const targetRoleName = CAREER_ROLES.find(r => r.id === appState.user.targetRoleId)?.name || "Full-Stack Developer";
    aiReplyText = `🎯 **REadON Mentor Guidance (${targetRoleName})**:

Regarding: *"${userText.slice(0, 80)}"*

• **Core Principle**: In REadON, engineering capability is evaluated via **P = 0.30K + 0.50A + 0.20R**.
• **Practical Assessment**: The best way to build your profile is to take a hands-on practical task in the **Assessment** tab where automated assertions verify your logic in an isolated sandbox.
• **Gaps**: Review your Dashboard for critical gap warnings before interviewing!`;
    modelBadge = "Offline Baseline";
  }

  // Append assistant message
  appState.aiChatHistory.push({
    role: "assistant",
    content: aiReplyText,
    model: modelBadge
  });
  saveState();

  if (sendBtn) sendBtn.disabled = false;
  chatBox.innerHTML = appState.aiChatHistory.map(msg => renderChatMessageBubble(msg)).join("");
  chatBox.scrollTop = chatBox.scrollHeight;
  if (input) input.focus();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderSettings(container) {
  container.innerHTML = `
    <div class="max-w-2xl mx-auto space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Settings & AI Configuration</h1>
        <p class="text-sm text-gray-400 mt-1">Manage your profile, target career role, and OpenRouter AI gateway.</p>
      </div>

      <!-- User Profile Settings -->
      <div class="glass-panel p-6 space-y-4">
        <h3 class="font-bold text-base border-b pb-2" style="border-color: var(--surface-border)">User Profile</h3>
        
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Full Name</label>
          <input id="setting-name" type="text" value="${appState.user.name}" class="w-full p-2.5 rounded-lg border text-sm" style="border-color: var(--surface-border); background: var(--bg-subtle)">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Experience Level / Persona</label>
          <select id="setting-persona" class="w-full p-2.5 rounded-lg border text-sm" style="border-color: var(--surface-border); background: var(--bg-subtle)">
            <option ${appState.user.experienceLevel.includes('Explorer') ? 'selected' : ''}>Explorer / Beginner</option>
            <option ${appState.user.experienceLevel.includes('Student') ? 'selected' : ''}>College Student / Fresher</option>
            <option ${appState.user.experienceLevel.includes('Job') ? 'selected' : ''}>Job Seeker / Transitioning</option>
            <option ${appState.user.experienceLevel.includes('Professional') ? 'selected' : ''}>Working Professional</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Target Career Role</label>
          <select id="setting-role" class="w-full p-2.5 rounded-lg border text-sm" style="border-color: var(--surface-border); background: var(--bg-subtle)">
            ${CAREER_ROLES.map(r => `
              <option value="${r.id}" ${r.id === appState.user.targetRoleId ? 'selected' : ''}>${r.name} (${r.status})</option>
            `).join("")}
          </select>
        </div>
      </div>

      <!-- OpenRouter AI Settings (PRD §15) -->
      <div class="glass-panel p-6 space-y-4">
        <h3 class="font-bold text-base border-b pb-2 text-purple-400 flex items-center justify-between" style="border-color: var(--surface-border)">
          <span>OpenRouter AI Configuration (PRD §15)</span>
          <span class="badge-pill bg-purple-500/20 text-purple-300 text-[10px]">Free Tier Enabled</span>
        </h3>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">OpenRouter API Key (Loaded from PRD)</label>
          <input id="setting-apikey" type="password" value="${appState.aiSettings.apiKey}" class="w-full p-2.5 rounded-lg border text-sm font-mono" style="border-color: var(--surface-border); background: var(--bg-subtle)">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Primary Model Route</label>
          <input id="setting-model" type="text" value="${appState.aiSettings.model}" class="w-full p-2.5 rounded-lg border text-sm font-mono" style="border-color: var(--surface-border); background: var(--bg-subtle)">
          <div class="text-[11px] text-gray-500 mt-1">Recommended: <code>google/gemini-2.0-flash-lite:free</code></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Fallback Model Route (NVIDIA Nemotron)</label>
          <input id="setting-fallback-model" type="text" value="${appState.aiSettings.fallbackModel || 'nvidia/llama-3.1-nemotron-70b-instruct'}" class="w-full p-2.5 rounded-lg border text-sm font-mono" style="border-color: var(--surface-border); background: var(--bg-subtle)">
          <div class="text-[11px] text-gray-500 mt-1">Automatically invoked if primary model fails or times out: <code>nvidia/llama-3.1-nemotron-70b-instruct</code></div>
        </div>
      </div>

      <div class="flex items-center justify-between pt-4">
        <button onclick="resetAllData()" class="text-xs font-semibold text-red-400 hover:underline">
          Reset All Data to PRD Defaults
        </button>
        <button onclick="saveSettings()" class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition shadow-lg">
          Save Settings
        </button>
      </div>
    </div>
  `;
}

function saveSettings() {
  const name = document.getElementById("setting-name").value;
  const persona = document.getElementById("setting-persona").value;
  const role = document.getElementById("setting-role").value;
  const apiKey = document.getElementById("setting-apikey").value;
  const model = document.getElementById("setting-model").value;
  const fallbackModel = document.getElementById("setting-fallback-model") ? document.getElementById("setting-fallback-model").value : "nvidia/llama-3.1-nemotron-70b-instruct";

  appState.user.name = name;
  appState.user.experienceLevel = persona;
  appState.user.targetRoleId = role;
  appState.aiSettings.apiKey = apiKey;
  appState.aiSettings.model = model;
  appState.aiSettings.fallbackModel = fallbackModel;

  saveState();
  showToast("Settings updated successfully!", "✓");
}

function resetAllData() {
  if (confirm("Reset your skill data and assessment history to default PRD baseline?")) {
    appState = { ...DEFAULT_STATE };
    saveState();
    showToast("Data reset to PRD baseline", "🔄");
    navigate("dashboard");
  }
}

// ==========================================
// 10. INITIALIZATION
// ==========================================

document.addEventListener("DOMContentLoaded", () => {
  document.documentElement.setAttribute("data-theme", appState.theme || "dark");
  updateThemeIcons();
  updateNavHeader();
  navigate("dashboard");
});


</script>
</body>
</html>
